# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve`. If you change this file, please restart the server process.

# Site Settings
locale                   : "en-GB"
title                    : "Timothy Wong"
title_separator          : "-"
name                     : &name "Timothy Wong"
description              : &description "Timothy Wong: UK-based data science, machine learning and AI engineering professional. Chartered Statistician (CStat) and Chartered Engineer (CEng)."
tagline                  : "Data science, machine learning and AI engineering." # shown under the name on the home page and in the footer
url                      : https://timothywong731.github.io # the base hostname & protocol for your site e.g. "https://mmistakes.github.io"
baseurl                  : "" # the subpath of your site, e.g. "/blog"
repository               : "timothywong731/timothywong731.github.io"
teaser                   :  # filename of teaser fallback teaser image placed in /images/, .e.g. "500x300.png"
breadcrumbs              : false # true, false (default)
words_per_minute         : 160
read_more                : "disabled" # if enabled, adds "Read more" links to excerpts
comments:
  provider               : # false (default), "disqus", "discourse", "facebook", "google-plus", "staticman", "custom"
  disqus:
    shortname            :
  discourse:
    server               : # https://meta.discourse.org/t/embedding-discourse-comments-via-javascript/31963 , e.g.: meta.discourse.org
  facebook:
    appid                :
    num_posts            : # 5 (default)
    colorscheme          : # "light" (default), "dark"
staticman:
  allowedFields          : ['name', 'email', 'url', 'message']
  branch                 : "gh-pages" # "master", "gh-pages"
  commitMessage          : "New comment."
  filename               : comment-{@timestamp}
  format                 : "yml"
  moderation             : true
  path                   : "_data/comments/{options.slug}"
  requiredFields         : ['name', 'email', 'message']
  transforms:
    email                : "md5"
  generatedFields:
    date:
      type               : "date"
      options:
        format           : "iso8601" # "iso8601" (default), "timestamp-seconds", "timestamp-milliseconds"
atom_feed:
  path                   : # blank (default) uses feed.xml

# SEO Related
google_site_verification : "xAkzcd577llci_eFOeB-KEgVRzv1m6Uu-gCcmcC2fuY" # from Google Search Console's "HTML tag" method
bing_site_verification   : # only needed if you verify Bing by meta tag instead of importing from Search Console
alexa_site_verification  :
yandex_site_verification :

# Social Sharing
twitter:
  username               : timothywong731
facebook:
  username               :
  app_id                 :
  publisher              :
og_image                 : "tim.png" # Open Graph/Twitter default site image, in /images/
# For specifying social profiles
# - https://developers.google.com/search/docs/appearance/structured-data/profile-page
social:
  type                   : # Person or Organization (defaults to Person)
  name                   : # If the user or organization name differs from the site's name
  alternate_name         : "Tim Wong"
  job_title              : "Data Science, Machine Learning and AI Engineering"
  knows_about:
    - "Data Science"
    - "Machine Learning"
    - "AI Engineering"
    - "Small Language Models"
    - "Statistics"
    - "Optimisation"
  links: # Profiles, in the order the header and footer show them; also used for JSON-LD sameAs
    - "https://www.linkedin.com/in/timothywong731"
    - "https://github.com/timothywong731"
    - "https://orcid.org/0000-0003-1943-6448"
    - "https://arxiv.org/a/0000-0003-1943-6448"
    - "https://x.com/timothywong731"
    - "https://huggingface.co/timothywong731"
    - "https://ollama.com/timothywong731"


# Analytics
analytics:
  provider               : false # false (default), "google", "google-universal", "custom"
  google:
    tracking_id          :


# Site Author
author:
  name             : "Timothy"
  avatar           : "tim.png"
  bio              : "Data science, machine learning and AI engineering." # one-liner beside the photo on every page except home
  location         : "United Kingdom"
  employer         :
  googlescholar    :
  email            : 
  uri              : "https://timothywong731.github.io"
  bitbucket        :
  codepen          :
  dribbble         :
  flickr           :
  facebook         : "timw731"
  foursquare       :
  github           : "timothywong731"
  google_plus      :
  keybase          :
  instagram        :
  lastfm           :
  linkedin         : "timothywong731"
  orcid            : "https://orcid.org/0000-0003-1943-6448"
  pinterest        :
  soundcloud       :
  stackoverflow    : # http://stackoverflow.com/users/123456/username
  steam            :
  tumblr           :
  twitter          : "timothywong731"
  vine             :
  weibo            :
  xing             :
  youtube          :
  wikipedia        :


# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - vendor/bundle
  - vendor/cache
  - vendor/gems
  - vendor/ruby
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/plugins
  - assets/js/_main.js
  - assets/js/vendor
  - Capfile
  - CHANGELOG
  - config
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - log
  - node_modules
  - package.json
  - Rakefile
  - README
  - tmp
  - CONTRIBUTING.md
  - DESIGN.md
  - CLAUDE.md
  - .playwright-mcp
  # template leftovers, kept out of the published site and search results
  - _posts
  - _drafts
  - _pages/markdown.md
  - _pages/non-menu-page.md
  - _pages/talkmap.html
  - talkmap
  - talkmap.py
  - talkmap.ipynb
  - markdown_generator
  - files/paper1.pdf
  - files/paper2.pdf
  - files/paper3.pdf
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# Collections
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/
  patents:
    output: true
    permalink: /:collection/:path/
  tutorials:
    output: true
    permalink: /:collection/:path/
  projects:
    output: true
    permalink: /:collection/:path/


# Defaults
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: false
      read_time: false
      comments: false
      share: false
      related: false
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  # _teaching
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
      comments: false
  # _publications
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: false
  # _portfolio
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: false
      share: false
      comment: false
  # _patents
  - scope:
      path: ""
      type: patents
    values:
      layout: talk
      author_profile: false
      share: false
  # _talks
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true
  # _projects
  - scope:
      path: ""
      type: projects
    values:
      layout: single
      share: true
  # _tutorials
  - scope:
      path: ""
      type: tutorials
    values:
      layout: single
      author_profile: true
      share: true
      comments: false

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed # http://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style


# Outputting
permalink: /:categories/:title/
# paginate: 5 # amount of posts to show
# paginate_path: /page:num/
timezone: America/Los_Angeles # http://en.wikipedia.org/wiki/List_of_tz_database_time_zones


# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from
# mimic GitHub Pages with --safe
whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji


# Archives
#  Type
#  - GitHub Pages compatible archive pages built with Liquid ~> type: liquid (default)
#  - Jekyll Archives plugin archive pages ~> type: jekyll-archives
#  Path (examples)
#  - Archive page should exist at path when using Liquid method or you can
#    expect broken links (especially with breadcrumbs enabled)
#  - <base_path>/tags/my-awesome-tag/index.html ~> path: /tags/
#  - <base_path/categories/my-awesome-category/index.html ~> path: /categories/
#  - <base_path/my-awesome-category/index.html ~> path: /
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
# https://github.com/jekyll/jekyll-archives
# jekyll-archives:
#   enabled:
#     - categories
#     - tags
#   layouts:
#     category: archive-taxonomy
#     tag: archive-taxonomy
#   permalinks:
#     category: /categories/:name/
#     tag: /tags/:name/


# HTML Compression
# - http://jch.penibelst.de/
compress_html:
  clippings: all
  ignore:
    envs: development
