<footer class="site-footer">
  <div class="wrap site-footer__inner">
    <div class="site-footer__id">
      <p class="site-footer__name">{{ site.name }}</p>
      <p class="site-footer__tagline">{{ site.tagline }}</p>
    </div>
    {% include social-links.html class="social-links--footer" %}
    <p class="site-footer__meta">
      <span>&copy; {{ site.time | date: "%Y" }} {{ site.name }}</span>
      <a href="{{ '/sitemap/' | relative_url }}">Sitemap</a>
      <a href="{{ '/llms.txt' | relative_url }}">llms.txt</a>
    </p>
  </div>
</footer>
